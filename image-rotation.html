<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Builder Blitz - Image Rotation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }

        .image-container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 90%;
            max-height: 90%;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.5s ease-in;
        }

        .image-container img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .loading {
            color: white;
            font-size: 40px;
            text-align: center;
        }

        .timer-overlay {
            position: fixed;
            top: 40px;
            right: 40px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 20px 30px;
            border-radius: 15px;
            font-size: 28px;
            font-weight: bold;
            z-index: 1000;
        }

        .timer-label {
            font-size: 16px;
            opacity: 0.8;
            margin-bottom: 5px;
        }

        .timer-countdown {
            font-size: 36px;
            color: #4ade80;
        }
    </style>
</head>
<body>
    <div class="timer-overlay">
        <div class="timer-label">Next Refresh:</div>
        <div class="timer-countdown" id="refreshTimer">0:00</div>
    </div>

    <div class="image-container">
        <div class="loading">Loading presentation...</div>
    </div>

    <script>
        // Local slide images
        const slideImages = ['Slide1.png'];
        let currentSlideIndex = 0;
        let refreshCountdown = 10; // 10 seconds on image page

        function updateRefreshTimer() {
            const timerElement = document.getElementById('refreshTimer');
            if (timerElement) {
                const mins = Math.floor(refreshCountdown / 60);
                const secs = refreshCountdown % 60;
                timerElement.textContent = `${mins}:${secs.toString().padStart(2, '0')}`;
            }
            
            refreshCountdown--;
            if (refreshCountdown < 0) {
                refreshCountdown = 0;
            }
        }

        function displayCurrentSlide() {
            if (slideImages.length === 0) return;

            const img = document.createElement('img');
            img.src = slideImages[currentSlideIndex];
            img.alt = 'Presentation Slide';
            img.onerror = () => {
                console.error('Failed to load slide image:', slideImages[currentSlideIndex]);
                document.querySelector('.image-container').innerHTML = 
                    '<div class="loading" style="color: #ff6b6b; font-size: 32px;">Unable to load slide image<br><br>Returning to leaderboard...</div>';
                
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 5000);
            };

            document.querySelector('.image-container').innerHTML = '';
            document.querySelector('.image-container').appendChild(img);

            // Move to next slide
            currentSlideIndex = (currentSlideIndex + 1) % slideImages.length;

            // Show image for 10 seconds, then return to leaderboard
            setTimeout(() => {
                window.location.href = 'index.html';
            }, 10000);
        }

        // Initialize timer
        updateRefreshTimer();
        setInterval(updateRefreshTimer, 1000);

        // Initialize slide display
        displayCurrentSlide();
    </script>
</body>
</html>
