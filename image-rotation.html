<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Builder Blitz - Image Rotation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }

        .image-container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 90%;
            max-height: 90%;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.5s ease-in;
        }

        .image-container img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .loading {
            color: white;
            font-size: 40px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="image-container">
        <div class="loading">Loading presentation...</div>
    </div>

    <script>
        // Local slide images
        const slideImages = ['Slide1.png'];
        let currentSlideIndex = 0;

        function displayCurrentSlide() {
            if (slideImages.length === 0) return;

            const img = document.createElement('img');
            img.src = slideImages[currentSlideIndex];
            img.alt = 'Presentation Slide';
            img.onerror = () => {
                console.error('Failed to load slide image:', slideImages[currentSlideIndex]);
                document.querySelector('.image-container').innerHTML = 
                    '<div class="loading" style="color: #ff6b6b; font-size: 32px;">Unable to load slide image<br><br>Returning to leaderboard...</div>';
                
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 5000);
            };

            document.querySelector('.image-container').innerHTML = '';
            document.querySelector('.image-container').appendChild(img);

            // Move to next slide
            currentSlideIndex = (currentSlideIndex + 1) % slideImages.length;

            // Show image for 10 seconds, then return to leaderboard
            setTimeout(() => {
                window.location.href = 'index.html';
            }, 10000);
        }

        // Initialize
        displayCurrentSlide();
    </script>
</body>
</html>
