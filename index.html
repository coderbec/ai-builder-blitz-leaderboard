<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Builder Blitz Leaderboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px;
            color: #333;
        }

        .banner {
            margin-bottom: 60px;
            animation: fadeIn 0.5s ease-in;
        }

        .banner img {
            max-width: 100%;
            height: auto;
            display: block;
        }

        .container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 60px;
            width: 100%;
            max-width: 1600px;
            animation: fadeIn 0.5s ease-in;
        }

        .table-section {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .table-section h2 {
            font-size: 48px;
            color: #667eea;
            margin-bottom: 30px;
            text-align: center;
            font-weight: bold;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 32px;
        }

        thead {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        th {
            padding: 25px 20px;
            text-align: left;
            font-weight: bold;
            border-radius: 10px;
        }

        td {
            padding: 20px;
            border-bottom: 2px solid #e0e0e0;
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        tbody tr:hover {
            background-color: #f5f5f5;
            transition: background-color 0.3s ease;
        }

        .rank {
            font-weight: bold;
            color: #667eea;
            width: 15%;
        }

        .name {
            width: 35%;
        }

        .company {
            width: 30%;
            font-size: 28px;
            color: #f0f0f0;
        }

        .duration {
            width: 20%;
            font-weight: bold;
            color: #ffffff;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @media (max-width: 1400px) {
            .container {
                grid-template-columns: 1fr;
                gap: 40px;
            }

            table {
                font-size: 28px;
            }

            .table-section h2 {
                font-size: 40px;
            }
        }

        .loading {
            text-align: center;
            color: white;
            font-size: 40px;
        }
    </style>
</head>
<body>
    <div class="banner">
        <img src="AI Builder Blitz Login Screen Graphic 975x300px.png" alt="AI Builder Blitz Banner">
    </div>

    <div class="container">
        <div class="table-section">
            <h2>⚡ Top 10 Fastest</h2>
            <table>
                <thead>
                    <tr>
                        <th class="rank">#</th>
                        <th class="name">First Name</th>
                        <th class="company">Company</th>
                        <th class="duration">Time</th>
                    </tr>
                </thead>
                <tbody id="topTable">
                    <tr>
                        <td colspan="4" class="loading">Loading...</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="table-section">
            <h2>🔥 Latest Finishers</h2>
            <table>
                <thead>
                    <tr>
                        <th class="rank">#</th>
                        <th class="name">First Name</th>
                        <th class="company">Company</th>
                        <th class="duration">Time</th>
                    </tr>
                </thead>
                <tbody id="latestTable">
                    <tr>
                        <td colspan="4" class="loading">Loading...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        async function fetchLeaderboardData() {
            try {
                // Add cache busting query parameter to always get fresh data
                const response = await fetch(`leaderboard-data.json?t=${Date.now()}`);
                if (!response.ok) throw new Error('Failed to load data');
                const data = await response.json();
                
                // Transform Workato API format to usable format
                if (data.rows && Array.isArray(data.rows)) {
                    return data.rows.map(row => ({
                        'First Name': row.col_First_name || '',
                        'Company': row.col_Company || '',
                        'DurationNumber': row.col_DurationNumber || 0
                    }));
                }
                return [];
            } catch (error) {
                console.error('Error fetching data:', error);
                return [];
            }
        }

        function formatDuration(durationNumber) {
            // DurationNumber is in days (decimal), convert to seconds
            const days = parseFloat(durationNumber);
            if (isNaN(days)) return 'N/A';
            
            const totalSeconds = Math.round(days * 24 * 60 * 60);
            const mins = Math.floor(totalSeconds / 60);
            const secs = totalSeconds % 60;
            
            if (mins > 0) {
                return `${mins}m ${secs}s`;
            }
            return `${secs}s`;
        }

        async function updateLeaderboard() {
            const data = await fetchLeaderboardData();
            
            if (!data || data.length === 0) {
                console.warn('No data available');
                return;
            }

            // Sort by DurationNumber for top 10
            const topData = [...data]
                .filter(item => item['First Name'] && item['Company'] && item['DurationNumber'])
                .sort((a, b) => parseFloat(a['DurationNumber']) - parseFloat(b['DurationNumber']))
                .slice(0, 10);

            // Get last 5 entries (most recent first)
            const latestData = [...data]
                .filter(item => item['First Name'] && item['Company'] && item['DurationNumber'])
                .reverse()
                .slice(0, 5);

            // Populate top 10 table
            const topTable = document.getElementById('topTable');
            if (topData.length > 0) {
                topTable.innerHTML = topData.map((row, index) => `
                    <tr>
                        <td class="rank">${index + 1}</td>
                        <td class="name">${row['First Name']}</td>
                        <td class="company">${row['Company']}</td>
                        <td class="duration">${formatDuration(row['DurationNumber'])}</td>
                    </tr>
                `).join('');
            } else {
                topTable.innerHTML = '<tr><td colspan="4" class="loading">No data available</td></tr>';
            }

            // Populate latest table
            const latestTable = document.getElementById('latestTable');
            if (latestData.length > 0) {
                latestTable.innerHTML = latestData.map((row, index) => `
                    <tr>
                        <td class="rank">${index + 1}</td>
                        <td class="name">${row['First Name']}</td>
                        <td class="company">${row['Company']}</td>
                        <td class="duration">${formatDuration(row['DurationNumber'])}</td>
                    </tr>
                `).join('');
            } else {
                latestTable.innerHTML = '<tr><td colspan="4" class="loading">No data available</td></tr>';
            }
        }

        // Update immediately and then every 10 seconds
        updateLeaderboard();
        setInterval(updateLeaderboard, 10000);

        // Rotate to image page every 30 seconds
        setTimeout(() => {
            window.location.href = 'image-rotation.html';
        }, 30000);
    </script>
</body>
</html>
